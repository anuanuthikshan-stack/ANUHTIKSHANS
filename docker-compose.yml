version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forecast_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SECRET_KEY=super-secret-industrial-forecasting-key-2026
    volumes:
      - ./saved_models:/app/saved_models
      - ./reports:/app/reports
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forecast_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: always
